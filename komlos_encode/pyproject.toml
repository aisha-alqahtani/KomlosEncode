[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komlos-encode"
version = "0.1.0"
description = "Compact +/-1 (Komlos-Hadamard) encoding of DNA/RNA/protein sequences with Hilbert-curve image support."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Kareem Kabbani" },
    { name = "Aisha Al-Qahtani" },
    { name = "Halima Bensmail", email = "hbensmail@hbku.edu.qa" },
]
keywords = ["bioinformatics", "sequence encoding", "deep learning", "genomics", "Hilbert curve"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/aisha-alqahtani/KomlosEncode"
Repository = "https://github.com/aisha-alqahtani/KomlosEncode"

[tool.setuptools.packages.find]
where = ["src"]
